[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; ── Web tier ─────────────────────────────────────────────────────────────
; When scaling out, the `magicai-web` container runs ONLY [php-fpm] + [nginx].
; Queue/scheduler programs below must NOT be enabled there (scheduler replicas
; would double-fire scheduled jobs).

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Worker tier ──────────────────────────────────────────────────────────
; `magicai-worker` container runs ONLY [queue] (scale horizontally as needed).

[program:queue]
command=/usr/local/bin/php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=840 --backoff=30
directory=/var/www
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_ENV="production"

; ── Scheduler tier ───────────────────────────────────────────────────────
; `magicai-scheduler` container runs ONLY [scheduler].
; NEVER scale this program to more than one replica — Laravel schedule:work
; would run the same scheduled jobs multiple times.

[program:scheduler]
command=/usr/local/bin/php /var/www/artisan schedule:work
directory=/var/www
priority=40
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_ENV="production"
